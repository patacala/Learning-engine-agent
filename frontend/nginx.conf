# nginx serves the SPA and reverse-proxies the backend on the SAME origin, so the
# frontend's relative "/api" calls work with no CORS. The API container is only
# reachable inside the compose network (service name "api"), never public.

upstream learning_engine_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Audio uploads (Learn ingest is multipart audio) — allow large bodies.
    client_max_body_size 100m;

    # --- REST API (includes SSE streams from Learn ingest) ---
    location /api/ {
        proxy_pass http://learning_engine_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / long-running LLM requests: don't buffer, allow long reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- Voice WebSocket (mounted at root, no /api prefix) ---
    location /voice/ {
        proxy_pass http://learning_engine_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- SPA static assets + client-side routing fallback ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
