# Production stack for Coolify (Docker Compose build pack).
# Public entrypoint = the `web` service (nginx): it serves the SPA and proxies
# /api and /voice to the internal `api` service. Only `web` needs a domain in
# Coolify. `api`, `postgres` and `redis` stay on the internal network.
#
# Set the environment variables (see the deploy notes) in Coolify's UI; they are
# substituted into the ${...} placeholders below. Secrets are NEVER baked into
# the images.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: learning_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: learning_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Datastores (built from POSTGRES_PASSWORD; hostnames = compose service names)
      DATABASE_URL: postgresql+asyncpg://learning_engine:${POSTGRES_PASSWORD}@postgres:5432/learning_engine
      DATABASE_SYNC_URL: postgresql://learning_engine:${POSTGRES_PASSWORD}@postgres:5432/learning_engine
      REDIS_URL: redis://redis:6379/0
      # App
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WEB_WORKERS: ${WEB_WORKERS:-4}
      # LLM providers
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PRIMARY_LLM_PROVIDER: ${PRIMARY_LLM_PROVIDER:-openai}
      PRIMARY_LLM_MODEL: ${PRIMARY_LLM_MODEL:-gpt-4o}
      ANALYZER_LLM_MODEL: ${ANALYZER_LLM_MODEL:-gpt-4o-mini}
      # Voice / CRM / provisioning (optional)
      RETELL_API_KEY: ${RETELL_API_KEY:-}
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET:-}
      # Internal endpoints fail closed in production when unset.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # UI login password (POST /auth/login) — fails closed in production when
      # unset, same as INTERNAL_API_TOKEN. The browser never sees either value
      # directly; login exchanges this for a short-lived session cookie.
      UI_LOGIN_PASSWORD: ${UI_LOGIN_PASSWORD:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off tenant bootstrap: creates the first organization + agent + assignment
  # and prints the API key (and fills the strategy catalog). Run ONCE after the
  # first deploy. Guarded by the "bootstrap" profile (never starts on deploy):
  #   docker compose -f docker-compose.prod.yml run --rm \
  #     -e BOOTSTRAP_ORG_NAME="Acme" -e BOOTSTRAP_ORG_SLUG=acme bootstrap
  # Idempotent — re-running reuses the org and prints the existing key.
  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "scripts.bootstrap_tenant"]
    environment:
      DATABASE_URL: postgresql+asyncpg://learning_engine:${POSTGRES_PASSWORD}@postgres:5432/learning_engine
      DATABASE_SYNC_URL: postgresql://learning_engine:${POSTGRES_PASSWORD}@postgres:5432/learning_engine
      REDIS_URL: redis://redis:6379/0
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-Default Org}
      BOOTSTRAP_ORG_SLUG: ${BOOTSTRAP_ORG_SLUG:-default}
      BOOTSTRAP_AGENT_TYPE: ${BOOTSTRAP_AGENT_TYPE:-sales}
      BOOTSTRAP_CAPABILITIES: ${BOOTSTRAP_CAPABILITIES:-full}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  # One-off strategy-catalog top-up (maintenance). Bootstrap already runs this, so
  # you only need it later (new agents / catalog changes). "seed" profile.
  #   docker compose -f docker-compose.prod.yml run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "scripts.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://learning_engine:${POSTGRES_PASSWORD}@postgres:5432/learning_engine
      DATABASE_SYNC_URL: postgresql://learning_engine:${POSTGRES_PASSWORD}@postgres:5432/learning_engine
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Public service. Either let Coolify map a domain to the exposed port, or
    # publish WEB_HOST_PORT on the host for an external tunnel (cloudflared,
    # etc.) to point at — do NOT use host port 80, it collides with Coolify's
    # own proxy.
    expose:
      - "80"
    ports:
      - "${WEB_HOST_PORT:-4007}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
